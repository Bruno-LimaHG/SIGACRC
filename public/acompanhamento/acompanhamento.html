<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGACRC - Acompanhamento de Protocolo</title>
    <link rel="stylesheet" href="/assets/css/sigacrc.css">
    <link rel="stylesheet" href="/components/a11y/a11y.css">
</head>
<body>
    <header class="topbar">
        <div class="layout topbar-conteudo">
            <a class="marca" href="/">
                <strong>SIGACRC</strong>
                <span>Acompanhamento de protocolo</span>
            </a>
            <nav class="nav-acoes">
                <a class="btn btn-secundario" href="/area-cliente">Área do cliente</a>
                <a class="btn" href="../formulario_casamento/formulario_casamento.html">Novo pedido</a>
                <span class="versao" style="background: white; border: 1px solid #e5e7eb; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: monospace; color: #6b7280; display: flex; align-items: center; justify-content: center; height: 32px; margin-left: 8px;" title="Versão do Sistema">v2.1.0</span>
            </nav>
        </div>
    </header>

    <main class="layout dashboard">
        <section class="card">
            <span class="tag">Consulta</span>
            <h1>Consultar protocolo</h1>
            <p>Digite o número de protocolo gerado após o envio do formulário.</p>

            <form id="formConsulta" class="form-grid">
                <div class="campo campo-grande">
                    <label for="campoProtocolo">Protocolo</label>
                    <input type="text" id="campoProtocolo" placeholder="Ex: SIGACRC-20260606-1234">
                </div>
                <div class="form-acoes campo-grande">
                    <button type="submit">Consultar</button>
                </div>
            </form>

            <div id="resultadoConsulta" class="mensagem oculto"></div>
        </section>
    </main>

    <script src="/assets/js/sigacrc-storage.js?v=5?v=2"></script>
    <script src="/acompanhamento/acompanhamento.js?v=4"></script>

    <!-- Início do Widget de Acessibilidade Personalizado -->
<!-- a11y.html - Componente Global de Acessibilidade -->
<div class="a11y-widget" id="a11yWidget">
  <!-- Painel de Opções -->
  <div 
    class="a11y-panel" 
    id="a11yPanel" 
    role="menu" 
    aria-label="Opções de Acessibilidade" 
    hidden
  >
    <button class="a11y-btn" id="btnIncreaseFont" role="menuitem" tabindex="-1">
      A+ (Aumentar Fonte)
    </button>
    <button class="a11y-btn" id="btnDecreaseFont" role="menuitem" tabindex="-1">
      A- (Diminuir Fonte)
    </button>
    <button class="a11y-btn" id="btnHighContrast" role="menuitem" tabindex="-1" aria-pressed="false">
      Alto Contraste
    </button>
    <button class="a11y-btn" id="btnHighlightLinks" role="menuitem" tabindex="-1" aria-pressed="false">
      Destacar Links
    </button>
  </div>

  <!-- Botão Principal Flutuante -->
  <button 
    class="a11y-main-btn" 
    id="a11yMainBtn" 
    aria-expanded="false" 
    aria-controls="a11yPanel"
    aria-label="Abrir menu de acessibilidade"
  >
    <!-- Ícone de Acessibilidade Universal (SVG) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor">
      <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
    </svg>
  </button>
</div>

    <script src="/components/a11y/a11y.js"></script>
    <!-- Fim do Widget de Acessibilidade Personalizado -->

    <!-- Início do VLibras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim do VLibras -->
</body>
</html>
