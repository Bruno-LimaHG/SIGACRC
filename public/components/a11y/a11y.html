<!-- a11y.html - Componente Global de Acessibilidade -->
<div class="a11y-widget" id="a11yWidget">
  <!-- Painel de Opções -->
  <div 
    class="a11y-panel" 
    id="a11yPanel" 
    role="menu" 
    aria-label="Opções de Acessibilidade" 
    hidden
  >
    <button class="a11y-btn" id="btnIncreaseFont" role="menuitem" tabindex="-1">
      A+ (Aumentar Fonte)
    </button>
    <button class="a11y-btn" id="btnDecreaseFont" role="menuitem" tabindex="-1">
      A- (Diminuir Fonte)
    </button>
    <button class="a11y-btn" id="btnHighContrast" role="menuitem" tabindex="-1" aria-pressed="false">
      Alto Contraste
    </button>
    <button class="a11y-btn" id="btnHighlightLinks" role="menuitem" tabindex="-1" aria-pressed="false">
      Destacar Links
    </button>
  </div>

  <!-- Botão Principal Flutuante -->
  <button 
    class="a11y-main-btn" 
    id="a11yMainBtn" 
    aria-expanded="false" 
    aria-controls="a11yPanel"
    aria-label="Abrir menu de acessibilidade"
  >
    <!-- Ícone de Acessibilidade Universal (SVG) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor">
      <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
    </svg>
  </button>
</div>
