<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGACRC - Validação do Funcionário</title>
    <link rel="stylesheet" href="/assets/css/sigacrc.css">
    <link rel="stylesheet" href="/components/a11y/a11y.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <aside class="auth-image">
                <div>
                    <h2>Validação institucional</h2>
                    <p>Simulação de certificado digital para acesso ao painel do escrevente.</p>
                </div>
            </aside>

            <div class="auth-content">
                <span class="tag">Certificado digital</span>
                <h1>Reconhecendo acesso</h1>
                <p id="descricaoMetodo">Conecte o token e aguarde o reconhecimento.</p>

                <div class="card" style="margin-top: 22px; text-align: center;">
                    <img src="../imagens/icp.png" alt="ICP Brasil" style="width: 92px; margin-bottom: 16px;">
                    <h3 id="statusToken">Procurando dispositivo...</h3>
                    <p id="textoToken">A autenticação será simulada para fins de demonstração do TCC.</p>
                </div>

                <div class="form-acoes">
                    <button type="button" id="btnEntrarPainel">Entrar no painel</button>
                    <a class="btn btn-secundario" href="../login_escreventes/login_escreventes.html">Voltar</a>
                </div>
            </div>
        </section>
    </main>

    <script src="/assets/js/sigacrc-storage.js?v=5"></script>
    <script src="/login_token/token.js"></script>

    <!-- Início do Widget de Acessibilidade Personalizado -->
<!-- a11y.html - Componente Global de Acessibilidade -->
<div class="a11y-widget" id="a11yWidget">
  <!-- Painel de Opções -->
  <div 
    class="a11y-panel" 
    id="a11yPanel" 
    role="menu" 
    aria-label="Opções de Acessibilidade" 
    hidden
  >
    <button class="a11y-btn" id="btnIncreaseFont" role="menuitem" tabindex="-1">
      A+ (Aumentar Fonte)
    </button>
    <button class="a11y-btn" id="btnDecreaseFont" role="menuitem" tabindex="-1">
      A- (Diminuir Fonte)
    </button>
    <button class="a11y-btn" id="btnHighContrast" role="menuitem" tabindex="-1" aria-pressed="false">
      Alto Contraste
    </button>
    <button class="a11y-btn" id="btnHighlightLinks" role="menuitem" tabindex="-1" aria-pressed="false">
      Destacar Links
    </button>
  </div>

  <!-- Botão Principal Flutuante -->
  <button 
    class="a11y-main-btn" 
    id="a11yMainBtn" 
    aria-expanded="false" 
    aria-controls="a11yPanel"
    aria-label="Abrir menu de acessibilidade"
  >
    <!-- Ícone de Acessibilidade Universal (SVG) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor">
      <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
    </svg>
  </button>
</div>

    <script src="/components/a11y/a11y.js"></script>
    <!-- Fim do Widget de Acessibilidade Personalizado -->

    <!-- Início do VLibras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim do VLibras -->
</body>
</html>
